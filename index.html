<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graphpaper</title>
    <!--
      The furniture of the page: the canvas, the log above the input, and the
      input bar that holds focus. main.ts finds each element by id.

      #panels holds one .panel for each selected object. main.ts builds and
      places them on every paint. The container takes no clicks, so an empty
      area falls through to the canvas below. Each .panel does take clicks. A
      panel that covers its own object hides that part from the mouse. The
      remedy is to drag the panel away.

      #panels floats over the canvas, so the canvas sits inside a positioned
      #stage. Nothing here holds state or behaviour.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        font: 14px ui-monospace, "Cascadia Mono", "Consolas", monospace;
        color: #1a1a1a;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        touch-action: none;
      }
      #panels {
        position: absolute;
        inset: 0;
        /* The container never takes a click. Each panel takes its own. */
        pointer-events: none;
      }
      .panel {
        position: absolute;
        left: 0;
        top: 0;
        box-sizing: border-box;
        max-width: 320px;
        max-height: 100%;
        overflow: auto;
        /* Every row is interactive: the paperclip, and the input it opens. */
        pointer-events: auto;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #d0d0d0;
        padding: 4px 6px;
        font: 12px ui-monospace, "Cascadia Mono", "Consolas", monospace;
        color: #1a1a1a;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-weight: bold;
        padding-bottom: 2px;
        /* The drag handle. It also carries the dismiss control. */
        pointer-events: auto;
        cursor: move;
      }
      .panel-dismiss {
        pointer-events: auto;
        cursor: pointer;
        border: none;
        background: transparent;
        font: inherit;
        line-height: 1;
        padding: 0 2px;
        color: inherit;
      }
      /* The thick rule between the modifiable slots and the derived ones. */
      .panel-rule {
        border-top: 3px solid #1a1a1a;
        margin: 3px 0;
      }
      /* The thin rule above the vertex list. */
      .panel-thin-rule {
        border-top: 1px solid #d0d0d0;
        margin: 3px 0;
      }
      /*
        The vertex list. A path can hold many vertices, so this is the one part
        of a panel that scrolls. Without the cap, a long path pushes the derived
        slots off screen and hides the drawing behind the panel.
      */
      .panel-parts {
        max-height: 220px;
        overflow-y: auto;
      }
      .panel-part {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .panel-part--open {
        background: #eef2fb;
      }
      .panel-part__vertex,
      .panel-part__chip {
        cursor: pointer;
        border: none;
        background: transparent;
        font: inherit;
        color: inherit;
        padding: 0;
        line-height: 1.35;
      }
      .panel-part__vertex {
        display: flex;
        gap: 8px;
        text-align: left;
      }
      .panel-part__index {
        color: #555555;
        min-width: 1.5em;
      }
      /* A vertex a formula holds. The grip on the canvas draws grey for the same reason. */
      .panel-part__vertex--held .panel-part__index,
      .panel-part__vertex--held .panel-part__position {
        color: #7a86a0;
        font-style: italic;
      }
      /* The shape of the edge that leaves this vertex. Nothing else says which of its five slots is live. */
      .panel-part__chip {
        color: #2456c9;
        min-width: 1.5em;
        text-align: center;
      }
      /* An open part indents its slot rows under the vertex that owns them. */
      .panel-row--nested {
        padding-left: 14px;
      }
      /*
        The swatch of a colour slot. It is a real colour input, so the browser
        opens its own wheel. A slot that holds no colour draws a slash instead
        of a colour, because a colour input cannot show the absence of one.
      */
      .panel-row__color {
        pointer-events: auto;
        cursor: pointer;
        width: 14px;
        height: 14px;
        padding: 0;
        border: 1px solid #b0b0b0;
        background: transparent;
        vertical-align: middle;
      }
      .panel-row__color::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      .panel-row__color::-webkit-color-swatch {
        border: none;
      }
      .panel-row__color--none {
        background-image: linear-gradient(to top right, transparent 45%, #c04040 45%, #c04040 55%, transparent 55%);
      }
      .panel-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        white-space: nowrap;
      }
      /* A derived row is italic. The operator cannot write it. */
      .panel-row--derived {
        font-style: italic;
      }
      .panel-row__path {
        color: #555555;
      }
      /* The right hand cluster: the paperclip and the value, or the row input. */
      .panel-row__right {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .panel-clip {
        cursor: pointer;
        line-height: 1;
      }
      /* Bold blue marks a formula slot. A click on it unlinks the slot. */
      .panel-clip--formula {
        color: #1a56db;
        font-weight: bold;
      }
      /* Faded and small on purpose. A click on it opens the row input. */
      .panel-clip--literal {
        color: #999999;
        font-size: 0.85em;
        opacity: 0.7;
      }
      /*
        The choose control on the source row of an image. It replaces the
        paperclip of that row. Nobody types a data URL, so the text input has
        nothing to offer here. It reads as a quiet link, like every other
        control in the panel.
      */
      .panel-pick {
        cursor: pointer;
        line-height: 1;
        font-size: 0.85em;
        color: #1a56db;
        white-space: nowrap;
      }
      .panel-row__input {
        font: inherit;
        width: 10em;
        box-sizing: border-box;
      }
      /*
        A drop down row. A slot with a small set of valid values offers them,
        so the operator does not have to know them. It replaces the value
        text and the paperclip. There is no edit mode. It commits on a change.
        Its width matches the text input it stands in for, so the right hand
        column does not jump between row kinds.
      */
      .panel-row__choice {
        font: inherit;
        width: 10em;
        box-sizing: border-box;
        cursor: pointer;
      }
      /*
        The in place editor: a real text input over the canvas, at the position
        of the receiver. A receiver is the content of a text object, or one
        table cell. main.ts sizes and places it on every paint. It also sets
        the font size, the family, the line height, the alignment and the
        colour inline, from the style slots of the receiver.

        This file must not set a font, a padding or a border. The box that
        main.ts places is the drawn box of the receiver. For an object with an
        auto width, that box fits the committed text exactly. So any inset
        makes the text no longer fit the box that the measurer measured. The
        focus ring is an outline, which paints outside the box and takes no
        layout.

        There are no scroll bars. main.ts measures the typed text on every
        keystroke and resizes this element to fit, so the box grows under the
        caret. The overflow rule is the belt to that brace. If a measurement
        falls a pixel short, the overflow clips out of sight. A scroll bar steals
        width and re-wraps the paragraph.

        The element lays out in world units, and one transform scales it. That
        is what makes a typed line break land where the drawn one does. The
        browser lays the text out at the same font size and width that
        render/measure.ts measures with, and the transform only magnifies the
        finished layout.

        The background is transparent, because the canvas does not draw this
        receiver while the editor is open. What shows through is the page.

        It mounts in #stage, not in #panels. One editor at a time.
      */
      .text-editor {
        position: absolute;
        box-sizing: border-box;
        margin: 0;
        border: none;
        padding: 0;
        background: transparent;
        resize: none;
        outline: 1px solid #1a56db;
        overflow: hidden;
        /*
          The wrap rule, stated here and not left to the browser default.
          render/measure.ts implements break-word exactly. A word too wide for
          the line splits between characters. The two must agree, so neither
          can rely on a default. The word-break rule keeps that split to a last
          resort.

          Do not set white-space here. The wrap attribute decides whether this
          box wraps at all, and an author rule overrides the white-space that
          the off value needs.
        */
        overflow-wrap: break-word;
        word-break: normal;
        z-index: 1;
      }
      #log {
        flex: 0 0 auto;
        max-height: 9em;
        overflow-y: auto;
        white-space: pre-wrap;
        padding: 4px 8px;
        border-top: 1px solid #d0d0d0;
        background: #fafafa;
      }
      #command {
        flex: 0 0 auto;
        border: none;
        border-top: 1px solid #d0d0d0;
        padding: 6px 8px;
        font: inherit;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="panels"></div>
      </div>
      <div id="log"></div>
      <input id="command" type="text" autocomplete="off" spellcheck="false" aria-label="command line" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
