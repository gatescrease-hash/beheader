<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graphpaper</title>
    <!--
      §5.10's interface: the canvas, the scrolling log above the input, and the
      always-focused input bar. main.ts finds each by id and wires it.

      #panels is D-094's properties panel container, now **D-101**'s N of
      them — one child `.panel` per selected object with a drawn extent
      (D-106's default), each built and positioned by main.ts every paint. The
      container itself takes no clicks (`pointer-events: none`, so an area
      with no panel falls through to the canvas beneath); each `.panel`
      likewise passes clicks through everywhere except its `.panel-header`,
      which D-101 clause 4 makes the drag handle and D-106 clause 2 gives a
      dismiss control — the only two things this cycle makes interactive.
      Editing a row's own value is D-102, still queued (D-094 clause 10's
      `pointer-events: none` on the BODY stands until then). It floats over
      the canvas, so the canvas lives inside a positioned #stage. Nothing here
      holds state or behaviour.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        font: 14px ui-monospace, "Cascadia Mono", "Consolas", monospace;
        color: #1a1a1a;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        touch-action: none;
      }
      #panels {
        position: absolute;
        inset: 0;
        /* See the comment above: the container itself never takes a click. */
        pointer-events: none;
      }
      .panel {
        position: absolute;
        left: 0;
        top: 0;
        box-sizing: border-box;
        max-width: 320px;
        max-height: 100%;
        overflow: auto;
        /* D-094 clause 10: the BODY stays display-only until D-102 — clicks pass through to the canvas. */
        pointer-events: none;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #d0d0d0;
        padding: 4px 6px;
        font: 12px ui-monospace, "Cascadia Mono", "Consolas", monospace;
        color: #1a1a1a;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-weight: bold;
        padding-bottom: 2px;
        /* D-101 clause 4: the ONE part of the panel that takes clicks this cycle — it is the drag handle, and it carries the dismiss control. */
        pointer-events: auto;
        cursor: move;
      }
      .panel-dismiss {
        pointer-events: auto;
        cursor: pointer;
        border: none;
        background: transparent;
        font: inherit;
        line-height: 1;
        padding: 0 2px;
        color: inherit;
      }
      /* D-094 clause 5: the thick rule between modifiable slots and derived ones. */
      .panel-rule {
        border-top: 3px solid #1a1a1a;
        margin: 3px 0;
      }
      .panel-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        white-space: nowrap;
      }
      /* D-094 clause 5: derived rows in italics — the operator cannot write them. */
      .panel-row--derived {
        font-style: italic;
      }
      .panel-row__path {
        color: #555555;
      }
      #log {
        flex: 0 0 auto;
        max-height: 9em;
        overflow-y: auto;
        white-space: pre-wrap;
        padding: 4px 8px;
        border-top: 1px solid #d0d0d0;
        background: #fafafa;
      }
      #command {
        flex: 0 0 auto;
        border: none;
        border-top: 1px solid #d0d0d0;
        padding: 6px 8px;
        font: inherit;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="panels"></div>
      </div>
      <div id="log"></div>
      <input id="command" type="text" autocomplete="off" spellcheck="false" aria-label="command line" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
