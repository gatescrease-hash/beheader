# The Rust side of the engine port. beheader-engine holds the logic being
# moved out of src/engine, and beheader-conformance answers the shared
# fixtures under tests/conformance so the two engines can be compared.
#
# The browser binding and the application adapter arrive with the hosting
# proof rather than as empty crates ahead of it.
#
# serde_json carries the wire codec. Its derive companion is a proposal in
# RUST_PORT.md rather than a decision, and the codec here is written out by
# hand because the document format has shapes that a derived one would accept
# or reject differently.
#
# libm supplies the transcendental functions in place of the ones the target
# brings. A native build otherwise reaches the system library and a
# wasm32-unknown-unknown build reaches a different implementation compiled in,
# and the two disagree on the last digit of a sine, so a conformance run on the
# native target would say nothing about the engine an operator loads.
[workspace]
resolver = "3"
members = ["crates/beheader-engine", "crates/beheader-conformance", "crates/beheader-hostproof", "crates/beheader-wasm"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
beheader-engine = { path = "crates/beheader-engine" }
serde_json = "1.0.145"
libm = "0.2.15"
